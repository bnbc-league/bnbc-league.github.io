.hero .faces{position:absolute;right:0;bottom:0;height:150px;max-width:none;opacity:.42;pointer-events:none;

.brand .sub{margin-top:6px;font-size:13px;color:#c9c9cf}

.upd{color:#9a9aa3;font-size:12px}

.note{color:var(--sub);font-size:12px;margin:-2px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:20px}.grid2>*{min-width:0}  /* 긴 표가 칸을 밀지 않고 표 안에서 옆으로 스크롤 */

table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border-bottom:1px solid var(--grid);padding:6px 9px;white-space:nowrap;text-align:left;height:30px}
tr:last-child td{border-bottom:0}
th{background:var(--head);font-weight:600;font-size:12px;color:var(--sub);letter-spacing:.02em}
tbody tr:hover td,table tr:hover td{background:var(--hover)}
td.n{text-align:right;font-variant-numeric:tabular-nums}

.W{color:var(--win);font-weight:700}.L{color:var(--lose);font-weight:700}.D{color:var(--draw);font-weight:700}

6점\n\n🔹 (4) SUB\n🏆 이모탈 붐 - 6 SUB : 업적 획득 및 +3점\n🏆 오메가 붐 - 7 SUB : 업적 획득 및 +6점\n\n🔹 (5) T/KO + SUB\n🔥 엘리트 샷 - 6개 적중: 업적 획득 및 +4점\n🔥 록스타 샷 - 7개 적중: 업적 획득 및 +8점", "3. BNBC 조건 점수 (공식 대회 및 프리 매치 상황 적용) 🔥\n시즌 10 이후\n\n스마트 픽 보너스 🧠 \n🎯 2개 언더독 픽 적중 시 (+2점)\n🎯 3개 언더독 픽 적중 시 (+3점)\n🎯 4개 이상 언더독 픽 적중 시 (+4점)\n🎯 5개 이상 언더독 픽 적중 시 (+5점)\n🎯 6개 이상 언더독 픽 적중 시 (+6점)\n🎯 7개 이상 언더독 픽 적중 시 (+7점)\n\n 4. 슈퍼 업셋 매치 💥[한 시즌 - 단 3회 사용 가능]\n✔ 배당 차이가 3배 이상 나는 경기! (EX : -400 +300)\n✔ 해당 경기는 보라색으로 표시.\n✔ 예측 적중 시 해당 경기의 점수는 +3점으로 계산합니다!\n(예: 3점 ➡️ 6점)\n\n※보라색 경기 주목!\n\n4. \n\n5. BNBC 패널티 시스템\n🔹 (1) 탑독 패널티 [올탑독]\n⚠️ 안전한 선택만 할 경우 불이익 부여\n✅ 공식 대회 및 라이징 게임 프리매치에서 적용\n\n🚨  기준: (상세결과 - 1경기부터)\n❌ 올탑독1 (모든 경기 탑독 선택 시 상세 3개 제외)\n(의도치 않은 초과사용 시 -2점 추가) : \n\n🔹 (2) 패널티 주의사항\n❗ 올탑독 사용하고 패배 시 타이틀전에서\n     : 추가 -2점 패널티 (누적 적용)\n❗ 배당 변화로 의도치 않게 올탑독이 될 경우에도 적용\n❗ 타이틀전 패널티 1위 인원은 대진표에 게시 예정(비난 의도가 아닌 타이틀전 패널티를 잘 모르는 분들을 위함)", "6. 라이징게임 참여 ONLY 불가능\n(쇼다운게임 3게임 이상 참여하면 1회 인정)\n\n1. 단순 승수 확보 목적의 참여 방지\n라이징게임만을 통해 승수를 쌓으려는 참여를 방지하기 위함입니다.\n\n2. 정규 경기(쇼다운게임) 중심의 경쟁 구조 유지\nBNBC의 기록은 정규 경기에서의 경쟁력을 중심으로 평가합니다.\n\n3. 운영진의 역할과 업무 범위\n운영진은 기록 관리자가 아닌, BNBC의 원활한 운영과 경쟁 환경을 관리하는 역할에 집중하고 있습니다.\n\n4. 과거 유사 사례 방지\n과거에도 승수 확보를 목적으로만 하는 의심되는 참여 사례가 있었던 만큼, 동일한 문제의 재발을 방지합니다.", "6. 챔피언을 위한 어드밴티지 🏆\n👑 챔피언 특전:\nvs 상대방 (+2점)\n\n 7. 픽 제출(예측) 마감 시간 ⏳\n🗓️ 파이트 위크 토요일 오전 9시까지 (모든 대회)\n\n 8. 픽 제출 및 관리 규정픽 제출 및 관리 규정\n\n  1) 픽 제출 시 자동 조정 시스템\n참가자가 오버탑독을 선택했으나 해당 카드가 적용되지 않거나 제출이 불확실한 상황이 발생할 경우, 시스템에서 자동으로 다음과 같이 처리합니다:\n\n-메인이벤트부터 차례대로 언더독 픽으로 변경\n-변경 순서는 이벤트 중요도에 따라 결정됩니다.\n\n  2) 휴식 기간 참가 의무 및 패널티\n-휴식 기간 동안의 참가 관리는 다음 기준에 따라 처리됩니다:\n\n특정 기간 안에 미참가 보고를 한 경우:\n-어떠한 패널티도 부과하지 않습니다.\n\n미참가 보고를 하지 않은 경우:\n강제 참가 처리되며, 다음과 같이 픽이 자동 배정됩니다:\n-파트너 픽 활용\n\n예외 사항 : \n참가자 부족으로 공석이 발생한 경우, 패널티를 적용하지 않습니다.\n\n   3) 픽보드 확정 및 수정 불가 원칙\n-참가자가 제출한 픽보드는 운영진의 2차 검토(with 당사자)를 거쳐 최종 확정됩니다.\n-확정된 픽보드에서 오류가 발견되더라도 수정할 수 없습니다.\n-참가자는 제출 전 충분한 검토를 통해 오류를 방지해야 합니다.\n\n🚨 오픈식 당일 오전 9시 이후 참여 시 패널티:\n✅ 쇼다운 및 프리 : [상세 결과 픽 4개 제외] <메인이벤트>부터\n*애티튜드까지 고려합니다. (차후 개선되는 모습을 보이지 const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=s=>String(s||"").replace(/[^0-9A-Za-z가-힣]/g,"").toLowerCase();

function pic(name){const k=key(name);if(D.pics[k])return D.pics[k];for(const pk in D.pics){if(k&&pk&&(pk.includes(k)||k.includes(pk))&&Math.min(pk.length,k.length)>=2)return D.pics[pk]}return""}
function nm(name,big){const p=pic(name);return `<span class="nm">${p?`<img class="av${big?" big":""}" src="${p}" alt="">`:""}${esc(name)}</span>`}
function rk(v){v=String(v||"").replace("#","").trim().toUpperCase();return v==="C"?"rC":v==="1"?"r1":v==="2"?"r2":v==="3"?"r3":""}
/* rows: [[셀 html …]], numFrom: 이 칸부터 오른쪽 정렬, cls: 줄마다 클래스 */
function table(cols,rows,numFrom,cls){return `<div class="tw"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.map((r,j)=>`<tr class="${cls?cls[j]||"":""}">${r.map((v,i)=>`<td${numFrom!=null&&i>=numFrom?' class="n"':""}>${v}</td>`).join("")}</tr>`).join("")}</table></div>`}

      ${m?`<div class="ntc" style="margin-bottom:8px">이번 ${c.no?"BNBC "+c.no+" ":""}${esc(m.sec)}에서 ${g.length+1}차전으로 붙어요</div>`:""}
      ${g.length?table(["차전","대회",esc(p.name)+" 결과","점차"],g.map(x=>[`<b>${x[4]}차전</b>`,esc(x[0]),`<span class="${x[1]}">${R[x[1]]}${x[1]!=="D"?" ("+esc(x[2])+")":""}</span>`,esc(x[3])])):'<div class="note">기록된 맞대결이 없어요</div>'}
      <div class="row" style="margin-top:6px">${o?`<button class="btn" id="vsflip">${esc(o.name)} 쪽에서 보기</button>`:""} <button class="btn" id="vsx">닫기</button></div></div>`;
    $("#vsx").onclick=()=>$("#vsd").innerHTML="";
    $("#vsflip")&&($("#vsflip").onclick=()=>{$("#q").value=o.name;show(o.name);vs(o,p.name);window.scrollTo(0,$("#pv").offsetTop-80)});
    if(typeof TX!=="undefined")applyTexts($("#vsd"));
    $("#vsd").scrollIntoView({behavior:"smooth",block:"start"})};
  $("#q").oninput=e=>{show(e.target.value);if(typeof TX!=="undefined")applyTexts($("#pv"))};
  const first=(ME&&ps.find(x=>x.k===ME.k))||ps[0];  /* 로그인한 선수면 내 기록부터 */
  if(first){$("#q").value=first.name;show(first.name)}
})();

/* 페이지 글 직접 수정 (GM) — 저장된 {구역: {원래 글: 바꿀 글}} 을 화면에 덮어씀 · 숨긴 칸은 안 보이게
   구역 = header · rank · match · rule · h2h  (GM 입력칸(.gm)은 건드리지 않음) */
const EDITABLE="h1,nav button,th,td,h2,.note,.rule,.secbar,.who b,.who span,.big";
var TX=D.texts||{},HID=new Set(D.hidden||[]),editMode=false;  // var: 위쪽 시즌표·상대전적이 먼저 그려질 때 아직 없어도 오류 안 나게
function scopeOf(el){const s=el.closest("section");return s?s.id:el.closest("header,nav")?"header":null}
function setText(el,t){const ns=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.nodeValue.trim())ns.push(n);
  if(!ns.length){el.appendChild(document.createTextNode(t));return}ns[0].nodeValue=t;ns.slice(1).forEach(x=>x.nodeValue="")}
function applyTexts(root){(root||document).querySelectorAll(EDITABLE).forEach(el=>{if(el.closest(".gm,dialog,.hidebtn"))return;const sc=scopeOf(el);if(!sc)return;
    const t=el.textContent.trim();if(el.dataset.orig==null)el.dataset.orig=t;const m=TX[sc];const o=el.dataset.orig;
    if(m&&m[o]!=null&&t!==m[o])setText(el,m[o])});
  (root||document).querySelectorAll(".block").forEach(b=>{const h=b.querySelector("h2"),sc=scopeOf(b);if(!h||!sc)return;const id=sc+"|"+(h.dataset.orig||h.textContent.trim());
    b.dataset.hid=id;b.style.display=HID.has(id)&&!GM?"none":"";b.style.opacity=HID.has(id)&&GM?".35":""})}
applyTexts();
if(GM){
  const bar=document.createElement("div");bar.className="gm";bar.id="editbar";bar.style.margin="0";
  bar.innerHTML=`<div class="row" style="margin:0"><b style="color:#e69138">페이지 수정</b><button class="btn" id="edon">글 직접 수정 켜기</button><span class="note" style="margin:0" id="edhint">켜면 화면의 글을 눌러서 바로 고칠 수 있어요 · 탭 이름은 눌러서 바꿈 · 칸마다 '숨기기'</span>
    <button class="btn p" id="edsv" style="display:none">수정 저장</button><button class="btn" id="edcancel" style="display:none">취소</button><button class="btn" id="edreset" style="margin-left:auto">글 수정 전부 되돌리기</button></div>`;
  $("header").appendChild(bar);
  const els=()=>[...document.querySelectorAll(EDITABLE)].filter(el=>!el.closest(".gm,dialog,.hidebtn")&&scopeOf(el));
  $("#edon").onclick=()=>{editMode=true;$("#edon").style.display="none";$("#edsv").style.display=$("#edcancel").style.display="";$("#edhint").textContent="고칠 글을 누르고 바꾼 뒤 '수정 저장' · 글을 다 지우면 그 글은 안 보여요";
    els().forEach(el=>{el.dataset.shown=el.textContent.trim();if(!el.matches("nav button")){el.contentEditable="true";el.style.outline="1px dashed #e69138"}});
    document.querySelectorAll(".block[data-hid]").forEach(b=>{const x=document.createElement("button");x.className="btn hidebtn";x.style.cssText="float:right;font-size:12px;padding:2px 8px";
      const upd=()=>x.textContent=HID.has(b.dataset.hid)?"다시 보이기":"숨기기";upd();x.onclick=()=>{HID.has(b.dataset.hid)?HID.delete(b.dataset.hid):HID.add(b.dataset.hid);upd();b.style.opacity=HID.has(b.dataset.hid)?".35":""};b.prepend(x)})};
  document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",e=>{if(!editMode)return;e.stopImmediatePropagation();const v=prompt("탭 이름",b.textContent.trim());if(v!=null)b.textContent=v.trim()},true));
  $("#edcancel").onclick=()=>location.reload();
  $("#edsv").onclick=()=>{const out=JSON.parse(JSON.stringify(TX));let n=0;
    els().forEach(el=>{const now=el.textContent.trim(),o=el.dataset.orig,sc=scopeOf(el);if(o==null||now===el.dataset.shown)return;out[sc]=out[sc]||{};
      if(now===o)delete out[sc][o];else out[sc][o]=now;n++});
    if(!confirm(`바뀐 글 ${n}곳 · 숨긴 칸 ${HID.size}개로 저장할까요?`))return;gm("texts",{texts:out,hidden:[...HID]})};
  $("#edreset").onclick=()=>{if(confirm("사이트에서 직접 고친 글과 숨긴 칸을 전부 원래대로 되돌릴까요?"))gm("texts",{texts:{},hidden:[]})};
}
</script></body></html>
